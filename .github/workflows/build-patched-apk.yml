name: Update validated PR 9 source fix

on:
  push:
    branches:
      - build/patched-apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pr-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/destroyed-vehicle-map-crash
          fetch-depth: 0

      - name: Apply validated Stracciatella 2420-style fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  print(f"already applied: {label}")
                  return
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one old match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"applied: {label}")

          map_file = "src/game/Strategic/Map_Screen_Interface_Map.cc"
          vehicles = "src/game/Tactical/Vehicles.cc"
          vehicles_h = "src/game/Tactical/Vehicles.h"

          replace_once(
              map_file,
              "\t\tSOLDIERTYPE const& vs = GetSoldierStructureForVehicle(v);\n\t\tif (vs.bTeam != OUR_TEAM) continue;",
              "\t\tif (auto s = FindSoldierType(v); !s || s->bTeam != OUR_TEAM) continue;",
              "ShowVehicles uses nullable vehicle soldier lookup",
          )

          replace_once(
              vehicles,
              "SOLDIERTYPE& GetSoldierStructureForVehicle(VEHICLETYPE const& v)\n{\n\tFOR_EACH_SOLDIER(s)\n\t{\n\t\tif (!(s->uiStatusFlags & SOLDIER_VEHICLE)) continue;\n\t\tif (s->bVehicleID != VEHICLE2ID(v))        continue;\n\t\treturn *s;\n\t}\n\tthrow std::logic_error(\"Vehicle has no corresponding soldier\");\n}",
              "SOLDIERTYPE * FindSoldierType(VEHICLETYPE const& v)\n{\n\tFOR_EACH_SOLDIER(s)\n\t{\n\t\tif (!(s->uiStatusFlags & SOLDIER_VEHICLE)) continue;\n\t\tif (s->bVehicleID != VEHICLE2ID(v))        continue;\n\t\treturn s;\n\t}\n\treturn nullptr;\n}\n\n\nSOLDIERTYPE& GetSoldierStructureForVehicle(VEHICLETYPE const& v)\n{\n\tif (auto pSoldier = FindSoldierType(v); pSoldier) return *pSoldier;\n\tthrow std::logic_error(\"Vehicle has no corresponding soldier\");\n}",
              "add nullable FindSoldierType helper",
          )

          replace_once(
              vehicles_h,
              "// the soldiertype containing this tactical incarnation of this vehicle\nSOLDIERTYPE& GetSoldierStructureForVehicle(VEHICLETYPE const&);",
              "// the soldiertype containing this tactical incarnation of this vehicle\n// This version returns nullptr if there is no corresponding soldier.\nSOLDIERTYPE * FindSoldierType(VEHICLETYPE const& v);\n// This version throws an exception if there is no corresponding soldier.\nSOLDIERTYPE& GetSoldierStructureForVehicle(VEHICLETYPE const&);",
              "declare nullable vehicle soldier lookup",
          )
          PY

          git diff --check
          git diff -- src/game/Strategic/Map_Screen_Interface_Map.cc src/game/Tactical/Vehicles.cc src/game/Tactical/Vehicles.h

      - name: Commit PR source update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "PR source already up to date"
            exit 0
          fi
          git config user.name "PhishyOne"
          git config user.email "123998606+PhishyOne@users.noreply.github.com"
          git add src/game/Strategic/Map_Screen_Interface_Map.cc src/game/Tactical/Vehicles.cc src/game/Tactical/Vehicles.h
          git commit -m "Use nullable lookup for destroyed vehicle map entries"
          git push origin HEAD:fix/destroyed-vehicle-map-crash
